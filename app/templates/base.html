<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre%}{{ NOM_APPLICATION }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  {# TODO (partie B): en-tête <header> contenant le nom de l'application 
    (lien vers/) et une navigation <nav> avec une liste de liens. #}
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>
  <header class="entete">
      <div class="conteneur entete__barre">
        <a class="logo" href="/">{{ NOM_APPLICATION }}</a>
        <nav aria-label="Navigation principale">
          <ul class="menu">
            <li><a href="/">Événements</a></li>
            <!-- À compléter : lien vers l'espace organisateur (/connexion) -->
          </ul>
        </nav>
      </div>
  </header>
  <main id="contenu">
    {% block contenu %}{% endblock %}
  </main>

  

  {# TODO (partie B) : pied de page <footer>. #}
    <footer class="pied-page">
    <div class="conteneur">
        <p>© 2026 AgendaCampus. Tous droits réservés.</p>
    </div>
</footer>
</body>
</html>
